{% extends 'base.html' %}{% block content %}
<h3>Резервные копии</h3>
<form method="post" action="/backups/create"><button class="btn btn-warning">Создать backup</button></form>
<table class="table table-dark mt-3"><tr><th>Файл</th><th>Дата</th><th>Действие</th></tr>
{% for b in backups %}<tr><td>{{ b.filename }}</td><td>{{ b.created_at }}</td><td><form method="post" action="/backups/restore/{{ b.id }}"><button class="btn btn-sm btn-secondary">Восстановить</button></form></td></tr>{% endfor %}
</table>
{% endblock %}
