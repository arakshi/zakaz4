<!doctype html><html lang="ru" data-bs-theme="dark"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><title>Login</title></head>
<body class="d-flex justify-content-center align-items-center" style="height:100vh;">
<form method="post" class="card p-4" style="min-width:360px;">
  <h4>Вход администратора</h4>
  {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
  <input class="form-control my-2" name="username" placeholder="Логин" required>
  <input class="form-control my-2" type="password" name="password" placeholder="Пароль" required>
  <button class="btn btn-primary w-100">Войти</button>
</form>
</body></html>
